name = "miemie-aowu-webapp"
main = ".open-next/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# miemieaowu.ai and www are served by the DMIT Hong Kong proxy (DNS-only A
# records since 2026-10-10), which forwards to this Worker via cf-origin.
# Do not re-add them here unless rolling back (see deploy/dmit-shadow/README.md).
routes = [
  { pattern = "cf-origin.miemieaowu.ai", custom_domain = true },
]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[d1_databases]]
binding = "miemie_aowu_db"
database_name = "miemie-aowu-db"
database_id = "e29eb320-cda4-47fc-8dde-416e73003315"

[[r2_buckets]]
binding = "miemie_aowu_photos"
bucket_name = "miemie-aowu-photos"

[vars]
NODE_ENV = "production"

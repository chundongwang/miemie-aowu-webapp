include snippets/miemie-upstream.conf;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_session_reuse on;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_redirect https://miemieaowu.ai/ /;
proxy_redirect https://cf-origin.miemieaowu.ai/ /;
# Cloudflare advertises HTTP/3 and NEL for its own edge; DMIT has no QUIC
# listener and no NEL endpoint, so never leak these to the browser.
proxy_hide_header Alt-Svc;
proxy_hide_header NEL;
proxy_hide_header Report-To;
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# Detailed benchmark log (added alongside the original "bench" format).
# body = response body bytes handed to the socket; total = incl. headers.
# done=OK only when nginx finished sending the whole response.
log_format bench_v2 'ts=$time_iso8601 ip=$remote_addr method=$request_method '
                    'uri="$request_uri" proto=$server_protocol status=$status '
                    'body=$body_bytes_sent total=$bytes_sent req_len=$request_length '
                    'rt=$request_time done=$request_completion rtt_us=$tcpinfo_rtt '
                    'conn=$connection reqs=$connection_requests range="$http_range" '
                    'clen="$sent_http_content_length" cenc="$sent_http_content_encoding" '
                    'ua="$http_user_agent"';

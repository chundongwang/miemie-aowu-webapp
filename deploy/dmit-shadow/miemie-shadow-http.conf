# miemieaowu shadow: shared http-level settings
log_format shadow 'ts=$time_iso8601 ip=$remote_addr host=$host method=$request_method '
                  'uri="$request_uri" proto=$server_protocol status=$status '
                  'body=$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                  'ust=$upstream_status cache=$upstream_cache_status done=$request_completion '
                  'rtt_us=$tcpinfo_rtt cfray="$upstream_http_cf_ray" ua="$http_user_agent"';

proxy_cache_path /var/cache/nginx/miemie levels=1:2 keys_zone=miemie:20m
                 max_size=4g inactive=30d use_temp_path=off;

# Cloudflare edge for the miemieaowu.ai zone. Pinned IPs (zone anycast) so the
# upstream never resolves back to this box once the apex points here.
upstream cf_edge {
    server 104.21.27.233:443;
    server 172.67.143.170:443;
    keepalive 32;
}
